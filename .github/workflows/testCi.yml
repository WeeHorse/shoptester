name: CI/CD Test

on:
  push:
    branches: ["actions"]
  pull_request:
    branches: ["actions"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api_tests:
    name: API tests (Newman)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # ---- Simple security gate ----
      - name: Security gate (fail on High/Critical vulnerable packages)
        shell: bash
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee vulnerabilities.txt
          if grep -Eiq "(Severity:\s*(Critical|High))" vulnerabilities.txt; then
            echo "Found High/Critical vulnerable packages. Failing the job."
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Install Newman
        run: npm install -g newman

      - name: Start server
        shell: bash
        run: |
          cd server
          nohup dotnet run --urls http://127.0.0.1:5000 > ../server-api.log 2>&1 &
          echo "Waiting for server..."
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/ >/dev/null 2>&1; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time."
          tail -n 200 ../server-api.log || true
          exit 1

      - name: Run API tests (Newman)
        shell: bash
        run: |
          newman run ./api-test/Test.postman_collection.json \
            -r cli,junit \
            --reporter-junit-export newman-results.xml

      - name: CI Job Summary
        if: always()
        shell: bash
        run: |
          echo "## ✅ CI Job Summary – ${{ job.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🔧 Build & Test" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: \`${{ runner.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🔐 Security Gate" >> $GITHUB_STEP_SUMMARY
          if [ -f vulnerabilities.txt ]; then
            echo "- Vulnerability scan: **executed**" >> $GITHUB_STEP_SUMMARY
            if grep -Eiq "(Severity:\s*(Critical|High))" vulnerabilities.txt; then
              echo "- Result: ❌ **High/Critical vulnerabilities found**" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Result: ✅ **No High/Critical vulnerabilities found**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- Vulnerability scan: ⚠️ *not executed*" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Test results (JUnit / TRX)" >> $GITHUB_STEP_SUMMARY
          echo "- Server logs" >> $GITHUB_STEP_SUMMARY
          echo "- Vulnerability report (text)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "> Generated by GitHub Actions CI pipeline" >> $GITHUB_STEP_SUMMARY

      - name: Upload API test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-test-artifacts
          if-no-files-found: warn
          path: |
            newman-results.xml
            vulnerabilities.txt
            server-api.log

  gui_tests:
    name: GUI tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build tests
        run: dotnet build -c Release --no-restore
        working-directory: ShopTester.Tests

      - name: Install Playwright browsers
        shell: pwsh
        working-directory: ShopTester.Tests
        run: |
          # Ensure build output exists
          dotnet build -c Release

          # Find Playwright install script (path varies by TFMs/config)
          $script = Get-ChildItem -Path . -Recurse -Filter "playwright.ps1" |
            Where-Object { $_.FullName -match "bin" } |
            Select-Object -First 1

          if (-not $script) {
            Write-Error "Could not find playwright.ps1. Ensure Microsoft.Playwright is referenced in ShopTester.Tests and build output was produced."
            Write-Host "Listing potential locations under bin/:"
            Get-ChildItem -Path .\bin -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }

          Write-Host "Using Playwright script at: $($script.FullName)"
          & $script.FullName install --with-deps

      - name: Start server
        shell: bash
        run: |
          cd server
          nohup dotnet run --urls http://127.0.0.1:5000 > ../server-gui.log 2>&1 &
          echo "Waiting for server..."
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/ >/dev/null 2>&1; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start in time."
          tail -n 200 ../server-gui.log || true
          exit 1

      - name: Run GUI tests
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=gui-tests.trx"
        working-directory: ShopTester.Tests

      - name: CI Job Summary
        if: always()
        shell: bash
        run: |
          echo "## ✅ CI Job Summary – ${{ job.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🔧 Build & Test" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: \`${{ runner.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🔐 Security Gate" >> $GITHUB_STEP_SUMMARY
          if [ -f vulnerabilities.txt ]; then
            echo "- Vulnerability scan: **executed**" >> $GITHUB_STEP_SUMMARY
            if grep -Eiq "(Severity:\s*(Critical|High))" vulnerabilities.txt; then
              echo "- Result: ❌ **High/Critical vulnerabilities found**" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Result: ✅ **No High/Critical vulnerabilities found**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- Vulnerability scan: ⚠️ *not executed*" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Test results (JUnit / TRX)" >> $GITHUB_STEP_SUMMARY
          echo "- Server logs" >> $GITHUB_STEP_SUMMARY
          echo "- Vulnerability report (text)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "> Generated by GitHub Actions CI pipeline" >> $GITHUB_STEP_SUMMARY

      - name: Upload GUI test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-artifacts
          if-no-files-found: warn
          path: |
            ShopTester.Tests/**/gui-tests.trx
            server-gui.log
